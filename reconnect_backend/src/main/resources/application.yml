spring:
  application:
    name: reconnect_backend
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  cache:
    type: ${SPRING_CACHE_TYPE:none}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mindhealth_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}

app:
  security:
    jwt-secret: ${JWT_SECRET:mindhealth-local-secret-change-this-32chars-min}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
    quest-proof-dir: ${QUEST_PROOF_DIR:proofs}
  ai:
    enabled: ${AI_ENABLED:false}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-version: ${GEMINI_API_VERSION:v1beta}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      timeout-ms: ${GEMINI_TIMEOUT_MS:8000}
    risk:
      call-ai-only-when-suspicious: ${AI_RISK_CALL_AI_ONLY_WHEN_SUSPICIOUS:true}
      ai-call-threshold: ${AI_RISK_AI_CALL_THRESHOLD:70}
    distortions:
      call-ai-only-when-suspicious: ${AI_DISTORTIONS_CALL_AI_ONLY_WHEN_SUSPICIOUS:true}
      max-suggestions: ${AI_DISTORTIONS_MAX_SUGGESTIONS:3}
  cache:
    enabled: ${APP_CACHE_ENABLED:false}
    therapist-directory-ttl-minutes: ${THERAPIST_DIRECTORY_CACHE_TTL_MINUTES:10}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@mindhealth.local}
    reset-password-subject: ${MAIL_RESET_PASSWORD_SUBJECT:MindHealth - Đặt lại mật khẩu}
    reset-password-url-base: ${MAIL_RESET_PASSWORD_URL_BASE:}

# Encryption configuration
# Keys are loaded from environment variables (ENCRYPTION_KEY, ENCRYPTION_IV)
encryption:
  key: ${ENCRYPTION_KEY:ReconnectMindH78}
  iv: ${ENCRYPTION_IV:MindHealthIv1234}

