services:
  mysql:
    image: mysql:8.0
    container_name: mindhealth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mindhealth_db
      MYSQL_USER: mindhealth_user
      MYSQL_PASSWORD: mindhealth_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: mindhealth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mindhealth-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  mailpit:
    image: axllent/mailpit:latest
    container_name: mindhealth-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ../reconnect_backend
    container_name: mindhealth-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - qdrant
      - mailpit
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mindhealth_db
      DB_USER: mindhealth_user
      DB_PASSWORD: mindhealth_password
      SERVER_PORT: 8080
      JWT_SECRET: mindhealth-docker-secret-change-this-32chars-min
      AI_ENABLED: "false"
      AI_RAG_ENABLED: "false"
      AI_RAG_AUTO_INGEST_ON_STARTUP: "false"
      AI_RAG_QDRANT_HOST: qdrant
      AI_RAG_QDRANT_PORT: 6333
      AI_RAG_QDRANT_COLLECTION: mindhealth_ai_knowledge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_CACHE_ENABLED: "true"
      SPRING_CACHE_TYPE: redis
      APP_MAIL_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@mindhealth.local
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS_ENABLE: "false"
    ports:
      - "8081:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_proofs:/app/proofs

  web:
    build:
      context: ../reconnect_web
    container_name: mindhealth-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  qdrant_data:
  backend_uploads:
  backend_proofs:
