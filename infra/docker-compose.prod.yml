services:
  mysql:
    image: mysql:8.0
    container_name: mindhealth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: mindhealth-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mindhealth-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: ${BACKEND_IMAGE}
    container_name: mindhealth-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - qdrant
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-false}
      AI_RAG_AUTO_INGEST_ON_STARTUP: ${AI_RAG_AUTO_INGEST_ON_STARTUP:-false}
      AI_RAG_QDRANT_HOST: qdrant
      AI_RAG_QDRANT_PORT: 6333
      AI_RAG_QDRANT_COLLECTION: ${AI_RAG_QDRANT_COLLECTION:-mindhealth_ai_knowledge}
      AI_RAG_QDRANT_API_KEY: ${AI_RAG_QDRANT_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      SPRING_CACHE_TYPE: redis
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_proofs:/app/proofs

  web:
    image: ${WEB_IMAGE}
    container_name: mindhealth-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  mysql_data:
  qdrant_data:
  backend_uploads:
  backend_proofs:
